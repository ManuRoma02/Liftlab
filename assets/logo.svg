<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Ceramic Tile -->
    <linearGradient id="bgObsidianPub" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151722"/>
      <stop offset="45%" stop-color="#090A0E"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Bezel Titanium Sheen -->
    <linearGradient id="bezelGleamPub" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.16)"/>
    </linearGradient>

    <!-- Core Emerald Radiance Aura -->
    <radialGradient id="emeraldAuraPub" cx="256" cy="256" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(48,209,88,0.30)"/>
      <stop offset="50%" stop-color="rgba(48,209,88,0.07)"/>
      <stop offset="100%" stop-color="rgba(48,209,88,0)"/>
    </radialGradient>

    <!-- Emerald L Primary Vector -->
    <linearGradient id="emGradPub" x1="136" y1="136" x2="376" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47F880"/>
      <stop offset="35%" stop-color="#30D158"/>
      <stop offset="85%" stop-color="#1EAA44"/>
      <stop offset="100%" stop-color="#158232"/>
    </linearGradient>

    <!-- Top Crest Specular Highlight for Emerald L -->
    <linearGradient id="emCrestPub" x1="136" y1="136" x2="224" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B2FFCB"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <!-- Titanium White L Accent Vector (Lab) -->
    <linearGradient id="whiteGradPub" x1="264" y1="136" x2="376" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F5F9"/>
      <stop offset="100%" stop-color="#D2D8E4"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensional Separation -->
    <filter id="markElevationPub" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
  </defs>

  <!-- Base Continuous Curvature Squircle Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgObsidianPub)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#bezelGleamPub)" stroke-width="2.5"/>

  <!-- Emerald Backlight Bloom -->
  <circle cx="256" cy="256" r="180" fill="url(#emeraldAuraPub)"/>

  <!-- Master Mark Group -->
  <g filter="url(#markElevationPub)">
    <!-- Primary Emerald 'L' (Lift) -->
    <path d="
      M 154 136
      C 144 136 136 144 136 154
      L 136 348
      C 136 363 148 376 164 376
      L 358 376
      C 368 376 376 368 376 358
      L 376 306
      C 376 296 368 288 358 288
      L 236 288
      C 229 288 224 283 224 276
      L 224 154
      C 224 144 216 136 206 136
      Z"
      fill="url(#emGradPub)"
    />

    <!-- Specular Titanium Glint on Top Crest of Emerald L -->
    <path d="
      M 154 136
      C 144 136 136 144 136 154
      L 136 164
      L 224 164
      L 224 154
      C 224 144 216 136 206 136
      Z"
      fill="url(#emCrestPub)"
      opacity="0.4"
    />

    <!-- Interlocking Titanium White 'L' (Lab / Overload Accent) -->
    <path d="
      M 276 136
      C 269 136 264 141 264 148
      L 264 232
      C 264 241 271 248 280 248
      L 364 248
      C 371 248 376 243 376 236
      L 376 216
      C 376 209 371 204 364 204
      L 316 204
      C 312 204 308 200 308 196
      L 308 148
      C 308 141 303 136 296 136
      Z"
      fill="url(#whiteGradPub)"
    />
  </g>
</svg>
